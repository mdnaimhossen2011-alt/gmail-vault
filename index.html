<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gmail Vault</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .shake { animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans">
    <div class="max-w-4xl mx-auto p-4 sm:p-6">
        <header class="flex flex-col sm:flex-row justify-between items-center pb-6 border-b border-slate-800 gap-4">
            <div class="flex items-center space-x-3">
                <div class="p-3 bg-red-500/10 rounded-xl text-red-500">
                    <i data-lucide="shield-check" class="w-8 h-8"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-bold">Gmail Vault</h1>
                    <p class="text-xs text-slate-400">নিরাপদ জিমেইল ও পাসওয়ার্ড সংরক্ষক</p>
                </div>
            </div>
            <div class="flex items-center space-x-2">
                <button onclick="openPinModal()" class="px-3 py-2 bg-slate-800 hover:bg-slate-700 rounded-lg text-xs flex items-center gap-2 text-slate-300">
                    <i data-lucide="key" class="w-4 h-4"></i> পিন পরিবর্তন
                </button>
                <button onclick="openAddModal()" class="px-4 py-2 bg-red-600 hover:bg-red-500 rounded-lg text-sm font-medium flex items-center gap-2">
                    <i data-lucide="plus" class="w-4 h-4"></i> নতুন জিমেইল
                </button>
            </div>
        </header>

        <div class="mt-6 flex flex-col sm:flex-row gap-4 justify-between items-center">
            <div class="relative w-full sm:w-80">
                <i data-lucide="search" class="w-4 h-4 absolute left-3 top-3 text-slate-500"></i>
                <input type="text" id="searchInput" oninput="renderVault()" placeholder="জিমেইল খুঁজুন..." class="w-full bg-slate-800 border border-slate-700 rounded-lg pl-9 pr-4 py-2 text-sm focus:outline-none focus:border-red-500 text-slate-200">
            </div>
            <div class="flex items-center gap-2">
                <button onclick="exportData()" class="px-3 py-2 bg-slate-800 hover:bg-slate-700 rounded-lg text-xs text-slate-300 flex items-center gap-1">
                    <i data-lucide="download" class="w-3.5 h-3.5"></i> ব্যাকআপ
                </button>
                <label class="px-3 py-2 bg-slate-800 hover:bg-slate-700 rounded-lg text-xs text-slate-300 cursor-pointer flex items-center gap-1">
                    <i data-lucide="upload" class="w-3.5 h-3.5"></i> রিস্টোর
                    <input type="file" id="importFile" onchange="importData(event)" class="hidden" accept=".json">
                </label>
            </div>
        </div>

        <div id="vaultList" class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-6"></div>
    </div>

    <!-- Add/Edit Modal -->
    <div id="accountModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-slate-800 rounded-2xl p-6 w-full max-w-md border border-slate-700">
            <h3 id="modalTitle" class="text-lg font-bold mb-4">নতুন জিমেইল যোগ করুন</h3>
            <form onsubmit="saveAccount(event)" class="space-y-4">
                <input type="hidden" id="editIndex">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">জিমেইল এড্রেস</label>
                    <input type="email" id="emailInput" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:outline-none focus:border-red-500">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">পাসওয়ার্ড</label>
                    <input type="password" id="passwordInput" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:outline-none focus:border-red-500">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">নোট (ঐচ্ছিক)</label>
                    <input type="text" id="noteInput" placeholder="যেমন: পার্সোনাল বা অফিশিয়াল" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:outline-none focus:border-red-500">
                </div>
                <div class="flex justify-end gap-2 pt-2">
                    <button type="button" onclick="closeModal('accountModal')" class="px-4 py-2 bg-slate-700 rounded-lg text-sm">বাতিল</button>
                    <button type="submit" class="px-4 py-2 bg-red-600 rounded-lg text-sm font-medium">সেভ করুন</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Security Check Modal -->
    <div id="pinCheckModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div id="pinBox" class="bg-slate-800 rounded-2xl p-6 w-full max-w-xs border border-slate-700 text-center">
            <i data-lucide="lock" class="w-10 h-10 text-red-500 mx-auto mb-2"></i>
            <h3 class="text-base font-bold mb-1">গোপন সিকিউরিটি কোড দিন</h3>
            <p class="text-xs text-slate-400 mb-4">পাসওয়ার্ডটি দেখতে পিন লিখুন</p>
            <input type="password" id="checkPinInput" class="w-full text-center bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-lg tracking-widest focus:outline-none focus:border-red-500 mb-4">
            <div class="flex gap-2">
                <button onclick="closeModal('pinCheckModal')" class="w-1/2 py-2 bg-slate-700 rounded-lg text-sm">বাতিল</button>
                <button onclick="verifyPinAndShow()" class="w-1/2 py-2 bg-red-600 rounded-lg text-sm font-medium">কনফার্ম</button>
            </div>
        </div>
    </div>

    <!-- Change PIN Modal -->
    <div id="changePinModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-slate-800 rounded-2xl p-6 w-full max-w-xs border border-slate-700">
            <h3 class="text-base font-bold mb-4 text-center">পিন পরিবর্তন করুন</h3>
            <div class="space-y-3">
                <input type="password" id="oldPin" placeholder="পুরাতন পিন" class="w-full text-center bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm">
                <input type="password" id="newPin" placeholder="নতুন পিন" class="w-full text-center bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm">
            </div>
            <div class="flex gap-2 mt-4">
                <button onclick="closeModal('changePinModal')" class="w-1/2 py-2 bg-slate-700 rounded-lg text-sm">বাতিল</button>
                <button onclick="updatePin()" class="w-1/2 py-2 bg-red-600 rounded-lg text-sm font-medium">সেভ</button>
            </div>
        </div>
    </div>

    <script>
        let accounts = JSON.parse(localStorage.getItem('gmail_vault_data')) || [];
        let masterPin = localStorage.getItem('gmail_vault_pin') || '1234';
        let activeIndex = null;

        function init() {
            lucide.createIcons();
            renderVault();
        }

        function simpleXOR(text, key) {
            let res = '';
            for (let i = 0; i < text.length; i++) {
                res += String.fromCharCode(text.charCodeAt(i) ^ key.charCodeAt(i % key.length));
            }
            return res;
        }

        function encryptData(text, key) {
            try {
                return btoa(encodeURIComponent(simpleXOR(text, key)));
            } catch (e) {
                return text;
            }
        }

        function decryptData(cipher, key) {
            try {
                return simpleXOR(decodeURIComponent(atob(cipher)), key);
            } catch (e) {
                return null;
            }
        }

        function renderVault() {
            const list = document.getElementById('vaultList');
            const search = document.getElementById('searchInput').value.toLowerCase();
            list.innerHTML = '';

            const filtered = accounts.filter(acc => acc.email.toLowerCase().includes(search));

            if (filtered.length === 0) {
                list.innerHTML = `<div class="col-span-full text-center py-12 text-slate-500 text-sm">কোনো জিমেইল অ্যাকাউন্ট পাওয়া যায়নি</div>`;
                return;
            }

            filtered.forEach((acc) => {
                const originalIndex = accounts.indexOf(acc);
                const card = document.createElement('div');
                card.className = 'bg-slate-800 border border-slate-700/60 rounded-xl p-4 flex flex-col justify-between';
                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-start">
                            <span class="text-xs px-2 py-0.5 bg-slate-700 text-slate-300 rounded">${acc.note || 'জিমেইল'}</span>
                            <div class="flex gap-1 text-slate-400">
                                <button onclick="editAccount(${originalIndex})" class="p-1 hover:text-white"><i data-lucide="edit-2" class="w-4 h-4"></i></button>
                                <button onclick="deleteAccount(${originalIndex})" class="p-1 hover:text-red-400"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                            </div>
                        </div>
                        <p class="font-medium text-slate-100 mt-2 text-sm break-all">${acc.email}</p>
                    </div>
                    <div class="mt-4 pt-3 border-t border-slate-700/50 flex justify-between items-center">
                        <div id="pass-field-${originalIndex}" class="text-xs text-slate-500 font-mono">••••••••••••</div>
                        <button onclick="requestPass(${originalIndex})" class="text-xs px-3 py-1.5 bg-red-600/10 text-red-400 hover:bg-red-600 hover:text-white transition rounded-md flex items-center gap-1">
                            <i data-lucide="eye" class="w-3.5 h-3.5"></i> পাসওয়ার্ড
                        </button>
                    </div>
                `;
                list.appendChild(card);
            });
            lucide.createIcons();
        }

        function openAddModal() {
            document.getElementById('modalTitle').innerText = 'নতুন জিমেইল যোগ করুন';
            document.getElementById('editIndex').value = '';
            document.getElementById('emailInput').value = '';
            document.getElementById('passwordInput').value = '';
            document.getElementById('noteInput').value = '';
            document.getElementById('accountModal').classList.remove('hidden');
        }

        function closeModal(id) {
            document.getElementById(id).classList.add('hidden');
        }

        function saveAccount(e) {
            e.preventDefault();
            const email = document.getElementById('emailInput').value;
            const rawPass = document.getElementById('passwordInput').value;
            const note = document.getElementById('noteInput').value;
            const index = document.getElementById('editIndex').value;

            const encryptedPass = encryptData(rawPass, masterPin);

            if (index === '') {
                accounts.push({ email, pass: encryptedPass, note });
            } else {
                accounts[index] = { email, pass: encryptedPass, note };
            }

            localStorage.setItem('gmail_vault_data', JSON.stringify(accounts));
            closeModal('accountModal');
            renderVault();
        }

        function requestPass(index) {
            activeIndex = index;
            document.getElementById('checkPinInput').value = '';
            document.getElementById('pinCheckModal').classList.remove('hidden');
            document.getElementById('checkPinInput').focus();
        }

        function verifyPinAndShow() {
            const pin = document.getElementById('checkPinInput').value;
            const box = document.getElementById('pinBox');

            if (pin === masterPin) {
                const dec = decryptData(accounts[activeIndex].pass, masterPin);
                const passContainer = document.getElementById(`pass-field-${activeIndex}`);
                if (dec !== null) {
                    passContainer.innerHTML = `<span class="text-green-400 font-bold select-all">${dec}</span>`;
                } else {
                    passContainer.innerHTML = `<span class="text-red-400">ডিক্রিপ্ট করা যায়নি</span>`;
                }
                closeModal('pinCheckModal');
            } else {
                box.classList.add('shake');
                setTimeout(() => box.classList.remove('shake'), 500);
            }
        }

        function editAccount(index) {
            document.getElementById('modalTitle').innerText = 'তথ্য এডিট করুন';
            document.getElementById('editIndex').value = index;
            document.getElementById('emailInput').value = accounts[index].email;
            document.getElementById('passwordInput').value = decryptData(accounts[index].pass, masterPin) || '';
            document.getElementById('noteInput').value = accounts[index].note || '';
            document.getElementById('accountModal').classList.remove('hidden');
        }

        function deleteAccount(index) {
            if (confirm('আপনি কি নিশ্চিত যে এই জিমেইলটি মুছে ফেলতে চান?')) {
                accounts.splice(index, 1);
                localStorage.setItem('gmail_vault_data', JSON.stringify(accounts));
                renderVault();
            }
        }

        function openPinModal() {
            document.getElementById('oldPin').value = '';
            document.getElementById('newPin').value = '';
            document.getElementById('changePinModal').classList.remove('hidden');
        }

        function updatePin() {
            const oldP = document.getElementById('oldPin').value;
            const newP = document.getElementById('newPin').value;

            if (oldP !== masterPin) {
                alert('পুরাতন পিন ভুল হয়েছে!');
                return;
            }
            if (newP.length < 4) {
                alert('নতুন পিন অন্তত ৪ ডিজিটের হতে হবে');
                return;
            }

            accounts = accounts.map(acc => {
                const plainPass = decryptData(acc.pass, masterPin);
                return { ...acc, pass: encryptData(plainPass || '', newP) };
            });

            masterPin = newP;
            localStorage.setItem('gmail_vault_pin', masterPin);
            localStorage.setItem('gmail_vault_data', JSON.stringify(accounts));
            closeModal('changePinModal');
            alert('পিন সফলভাবে পরিবর্তন হয়েছে!');
            renderVault();
        }

        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(accounts));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "gmail_vault_backup.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function importData(e) {
            const fileReader = new FileReader();
            fileReader.onload = function (event) {
                try {
                    const imported = JSON.parse(event.target.result);
                    if (Array.isArray(imported)) {
                        accounts = imported;
                        localStorage.setItem('gmail_vault_data', JSON.stringify(accounts));
                        renderVault();
                        alert('ডাটা সফলভাবে ইমপোর্ট হয়েছে!');
                    }
                } catch (err) {
                    alert('ভুল ফাইল ফরম্যাট!');
                }
            };
            fileReader.readAsText(e.target.files[0]);
        }

        window.onload = init;
    </script>
</body>
</html>
